<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 520" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arr-2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8 Z" fill="#334155"/>
    </marker>
    <filter id="sh2" x="-5%" y="-5%" width="110%" height="114%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="15" y="15" width="990" height="490" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  
  <!-- Header Badge -->
  <rect x="30" y="8" width="180" height="24" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="120" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">Level 2 : Detailed Processes</text>

  <!-- ================= COLUMN 1: 1.0 Document Upload & Processing ================= -->
  <g transform="translate(30, 48)">
    <rect x="0" y="0" width="180" height="438" rx="8" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.4" stroke-dasharray="5 4"/>
    <!-- Title banner -->
    <rect x="8" y="8" width="164" height="34" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
    <text x="90" y="23" text-anchor="middle" font-size="11" font-weight="800" fill="#1e3a8a">1.0 Document Upload</text>
    <text x="90" y="36" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1d4ed8">&amp; Processing</text>

    <!-- Subprocess 1.1 -->
    <rect x="12" y="60" width="156" height="44" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#sh2)"/>
    <text x="90" y="79" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Upload File</text>
    <text x="90" y="93" text-anchor="middle" font-size="9" font-weight="500" fill="#64748b">(PDF / DOCX / Images)</text>

    <path d="M 90 104 L 90 128" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-2)"/>

    <!-- Subprocess 1.2 -->
    <rect x="12" y="130" width="156" height="44" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#sh2)"/>
    <text x="90" y="149" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Text Extraction</text>
    <text x="90" y="163" text-anchor="middle" font-size="9" font-weight="500" fill="#64748b">(OCR if needed)</text>

    <path d="M 90 174 L 90 200" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-2)"/>

    <!-- Subprocess 1.3 -->
    <rect x="12" y="202" width="156" height="40" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#sh2)"/>
    <text x="90" y="226" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Text Preprocessing</text>

    <path d="M 90 242 L 90 268" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-2)"/>

    <!-- Subprocess 1.4 -->
    <rect x="12" y="270" width="156" height="40" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#sh2)"/>
    <text x="90" y="294" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Text Chunking</text>
  </g>

  <!-- Horizontal Connector 1 -> 2 -->
  <path d="M 210 238 L 228 238" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arr-2)"/>

  <!-- ================= COLUMN 2: 2.0 Embedding & Storage ================= -->
  <g transform="translate(230, 48)">
    <rect x="0" y="0" width="180" height="438" rx="8" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.4" stroke-dasharray="5 4"/>
    <rect x="8" y="8" width="164" height="34" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
    <text x="90" y="23" text-anchor="middle" font-size="11" font-weight="800" fill="#1e3a8a">2.0 Embedding</text>
    <text x="90" y="36" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1d4ed8">&amp; Storage</text>

    <!-- Subprocess 2.1 -->
    <rect x="12" y="80" width="156" height="46" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#sh2)"/>
    <text x="90" y="100" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Generate Embeddings</text>
    <text x="90" y="115" text-anchor="middle" font-size="8.5" font-weight="500" fill="#64748b">(Sentence Transformers)</text>

    <path d="M 90 126 L 90 168" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-2)"/>

    <!-- Subprocess 2.2 -->
    <rect x="12" y="170" width="156" height="46" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#sh2)"/>
    <text x="90" y="190" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Store in Vector DB</text>
    <text x="90" y="205" text-anchor="middle" font-size="9" font-weight="500" fill="#64748b">(ChromaDB)</text>

    <path d="M 90 216 L 90 258" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-2)"/>

    <!-- Subprocess 2.3 -->
    <rect x="12" y="260" width="156" height="46" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#sh2)"/>
    <text x="90" y="280" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Create / Update</text>
    <text x="90" y="295" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">Knowledge Graph</text>
  </g>

  <!-- Horizontal Connector 2 -> 3 -->
  <path d="M 410 238 L 428 238" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arr-2)"/>

  <!-- ================= COLUMN 3: 3.0 Search & RAG Retrieval ================= -->
  <g transform="translate(430, 48)">
    <rect x="0" y="0" width="180" height="438" rx="8" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.4" stroke-dasharray="5 4"/>
    <rect x="8" y="8" width="164" height="34" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
    <text x="90" y="23" text-anchor="middle" font-size="11" font-weight="800" fill="#1e3a8a">3.0 Search &amp;</text>
    <text x="90" y="36" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1d4ed8">RAG Retrieval</text>

    <!-- Subprocess 3.1 -->
    <rect x="12" y="60" width="156" height="40" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#sh2)"/>
    <text x="90" y="84" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">User Query</text>

    <path d="M 90 100 L 90 126" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-2)"/>

    <!-- Subprocess 3.2 -->
    <rect x="12" y="128" width="156" height="40" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#sh2)"/>
    <text x="90" y="152" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Convert to Embedding</text>

    <path d="M 90 168 L 90 196" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-2)"/>

    <!-- Subprocess 3.3 -->
    <rect x="12" y="198" width="156" height="44" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#sh2)"/>
    <text x="90" y="217" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a">Retrieve Chunks</text>
    <text x="90" y="231" text-anchor="middle" font-size="9" font-weight="500" fill="#64748b">(ChromaDB)</text>

    <path d="M 90 242 L 90 268" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-2)"/>

    <!-- Subprocess 3.4 -->
    <rect x="12" y="270" width="156" height="44" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#sh2)"/>
    <text x="90" y="289" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a">Query Knowledge Graph</text>
    <text x="90" y="303" text-anchor="middle" font-size="9" font-weight="500" fill="#64748b">(Entity Relationships)</text>
  </g>

  <!-- Horizontal Connector 3 -> 4 -->
  <path d="M 610 238 L 628 238" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arr-2)"/>

  <!-- ================= COLUMN 4: 4.0 AI Processing (LLM) ================= -->
  <g transform="translate(630, 48)">
    <rect x="0" y="0" width="180" height="438" rx="8" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.4" stroke-dasharray="5 4"/>
    <rect x="8" y="8" width="164" height="34" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
    <text x="90" y="23" text-anchor="middle" font-size="11" font-weight="800" fill="#1e3a8a">4.0 AI Processing</text>
    <text x="90" y="36" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1d4ed8">(LLM)</text>

    <!-- Subprocess 4.1 -->
    <rect x="12" y="60" width="156" height="44" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#sh2)"/>
    <text x="90" y="79" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a">Send Retrieved Content</text>
    <text x="90" y="93" text-anchor="middle" font-size="9" font-weight="500" fill="#64748b">to Ollama LLM</text>

    <path d="M 90 104 L 90 128" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-2)"/>

    <!-- Subprocess 4.2 -->
    <rect x="12" y="130" width="156" height="40" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#sh2)"/>
    <text x="90" y="154" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Generate AI Response</text>

    <path d="M 90 170 L 90 198" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-2)"/>

    <!-- Subprocess 4.3 -->
    <rect x="12" y="200" width="156" height="44" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#sh2)"/>
    <text x="90" y="219" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a">Generate Summary</text>
    <text x="90" y="233" text-anchor="middle" font-size="9" font-weight="500" fill="#64748b">(if requested)</text>

    <path d="M 90 244 L 90 270" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-2)"/>

    <!-- Subprocess 4.4 -->
    <rect x="12" y="272" width="156" height="40" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#sh2)"/>
    <text x="90" y="296" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Extract Dates / Events</text>
  </g>

  <!-- Horizontal Connector 4 -> 5 -->
  <path d="M 810 238 L 828 238" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arr-2)"/>

  <!-- ================= COLUMN 5: 5.0 Output & Integrations ================= -->
  <g transform="translate(830, 48)">
    <rect x="0" y="0" width="165" height="438" rx="8" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.4" stroke-dasharray="5 4"/>
    <rect x="6" y="8" width="153" height="34" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
    <text x="82" y="23" text-anchor="middle" font-size="11" font-weight="800" fill="#1e3a8a">5.0 Output &amp;</text>
    <text x="82" y="36" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1d4ed8">Integrations</text>

    <!-- Subprocess 5.1 -->
    <rect x="8" y="60" width="149" height="44" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#sh2)"/>
    <text x="82" y="79" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a">Display Result to User</text>
    <text x="82" y="93" text-anchor="middle" font-size="8.5" font-weight="500" fill="#64748b">(Answer / Summary)</text>

    <path d="M 82 104 L 82 128" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-2)"/>

    <!-- Subprocess 5.2 -->
    <rect x="8" y="130" width="149" height="44" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#sh2)"/>
    <text x="82" y="149" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">Convert Text to Speech</text>
    <text x="82" y="163" text-anchor="middle" font-size="8.5" font-weight="500" fill="#64748b">(if requested)</text>

    <path d="M 82 174 L 82 200" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-2)"/>

    <!-- Subprocess 5.3 -->
    <rect x="8" y="202" width="149" height="44" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#sh2)"/>
    <text x="82" y="221" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a">Save Events to</text>
    <text x="82" y="235" text-anchor="middle" font-size="9" font-weight="500" fill="#64748b">Google Calendar</text>

    <path d="M 82 246 L 82 272" fill="none" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-2)"/>

    <!-- Subprocess 5.4 -->
    <rect x="8" y="274" width="149" height="44" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#sh2)"/>
    <text x="82" y="293" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a">Send Email Reminder</text>
    <text x="82" y="307" text-anchor="middle" font-size="8.5" font-weight="500" fill="#64748b">(via Gmail)</text>
  </g>
</svg>