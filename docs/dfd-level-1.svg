<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 540" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arr-1" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8 Z" fill="#334155"/>
    </marker>
    <filter id="sh1" x="-6%" y="-6%" width="112%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="15" y="15" width="990" height="510" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  
  <!-- Header Badge -->
  <rect x="30" y="8" width="170" height="24" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="115" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">Level 1 : Main Processes</text>

  <!-- ENTITY: User (Left) -->
  <rect x="35" y="170" width="85" height="60" rx="4" fill="#ffffff" stroke="#1e293b" stroke-width="1.8" filter="url(#sh1)"/>
  <text x="77" y="206" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">User</text>

  <!-- User <-> 1.0 Flows -->
  <path d="M 120 185 L 178 185" fill="none" stroke="#334155" stroke-width="1.4" marker-end="url(#arr-1)"/>
  <text x="150" y="172" text-anchor="middle" font-size="9" font-weight="600" fill="#334155">Documents /</text>
  <text x="150" y="182" text-anchor="middle" font-size="9" font-weight="600" fill="#334155">Images / Queries</text>

  <path d="M 180 215 L 122 215" fill="none" stroke="#334155" stroke-width="1.4" marker-end="url(#arr-1)"/>
  <text x="150" y="235" text-anchor="middle" font-size="8.5" font-weight="600" fill="#334155">Search Results</text>
  <text x="150" y="246" text-anchor="middle" font-size="8.5" font-weight="600" fill="#334155">AI Response</text>
  <text x="150" y="257" text-anchor="middle" font-size="8.5" font-weight="600" fill="#334155">Summary / Events</text>

  <!-- ================= PROCESS CIRCLES ================= -->
  <!-- 1.0 Document Upload & Processing -->
  <circle cx="230" cy="200" r="48" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" filter="url(#sh1)"/>
  <text x="230" y="182" text-anchor="middle" font-size="12" font-weight="800" fill="#1e40af">1.0</text>
  <text x="230" y="198" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">Document</text>
  <text x="230" y="212" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">Upload &amp;</text>
  <text x="230" y="226" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">Processing</text>

  <!-- Arrow 1.0 -> 2.0 -->
  <path d="M 278 200 L 328 200" fill="none" stroke="#334155" stroke-width="1.4" marker-end="url(#arr-1)"/>
  <text x="303" y="192" text-anchor="middle" font-size="9" font-weight="600" fill="#334155">Processed Text</text>

  <!-- 2.0 Embedding & Storage -->
  <circle cx="376" cy="200" r="48" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" filter="url(#sh1)"/>
  <text x="376" y="186" text-anchor="middle" font-size="12" font-weight="800" fill="#1e40af">2.0</text>
  <text x="376" y="204" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">Embedding</text>
  <text x="376" y="218" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">&amp; Storage</text>

  <!-- Arrow 2.0 -> 3.0 -->
  <path d="M 424 200 L 474 200" fill="none" stroke="#334155" stroke-width="1.4" marker-end="url(#arr-1)"/>
  <text x="449" y="187" text-anchor="middle" font-size="9" font-weight="600" fill="#334155">Stored</text>
  <text x="449" y="197" text-anchor="middle" font-size="9" font-weight="600" fill="#334155">Embeddings</text>

  <!-- 3.0 Search & RAG Retrieval -->
  <circle cx="522" cy="200" r="48" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" filter="url(#sh1)"/>
  <text x="522" y="184" text-anchor="middle" font-size="12" font-weight="800" fill="#1e40af">3.0</text>
  <text x="522" y="200" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Search &amp;</text>
  <text x="522" y="214" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">RAG Retrieval</text>

  <!-- Arrow 3.0 -> 4.0 -->
  <path d="M 570 200 L 620 200" fill="none" stroke="#334155" stroke-width="1.4" marker-end="url(#arr-1)"/>
  <text x="595" y="187" text-anchor="middle" font-size="9" font-weight="600" fill="#334155">Relevant</text>
  <text x="595" y="197" text-anchor="middle" font-size="9" font-weight="600" fill="#334155">Content</text>

  <!-- 4.0 AI Processing (LLM) -->
  <circle cx="668" cy="200" r="48" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" filter="url(#sh1)"/>
  <text x="668" y="186" text-anchor="middle" font-size="12" font-weight="800" fill="#1e40af">4.0</text>
  <text x="668" y="204" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">AI Processing</text>
  <text x="668" y="218" text-anchor="middle" font-size="9.5" font-weight="600" fill="#475569">(LLM)</text>

  <!-- Arrow 4.0 -> 5.0 -->
  <path d="M 716 200 L 766 200" fill="none" stroke="#334155" stroke-width="1.4" marker-end="url(#arr-1)"/>

  <!-- 5.0 Output & Integrations -->
  <circle cx="814" cy="200" r="48" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" filter="url(#sh1)"/>
  <text x="814" y="186" text-anchor="middle" font-size="12" font-weight="800" fill="#1e40af">5.0</text>
  <text x="814" y="204" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Output &amp;</text>
  <text x="814" y="218" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Integrations</text>

  <!-- Outputs to Google Calendar & Gmail -->
  <path d="M 852 176 Q 875 145 908 145" fill="none" stroke="#334155" stroke-width="1.4" marker-end="url(#arr-1)"/>
  <text x="862" y="140" font-size="8.5" font-weight="600" fill="#334155">Event Data</text>

  <rect x="912" y="125" width="80" height="42" rx="4" fill="#ffffff" stroke="#1e293b" stroke-width="1.6"/>
  <text x="952" y="143" text-anchor="middle" font-size="9.5" font-weight="700" fill="#0f172a">Google</text>
  <text x="952" y="156" text-anchor="middle" font-size="8.5" font-weight="600" fill="#0f172a">Calendar API</text>

  <path d="M 852 224 Q 875 255 908 255" fill="none" stroke="#334155" stroke-width="1.4" marker-end="url(#arr-1)"/>
  <text x="850" y="268" font-size="8.5" font-weight="600" fill="#334155">Reminder Emails</text>

  <rect x="912" y="235" width="80" height="42" rx="4" fill="#ffffff" stroke="#1e293b" stroke-width="1.6"/>
  <text x="952" y="252" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Gmail</text>
  <text x="952" y="264" text-anchor="middle" font-size="8" font-weight="500" fill="#475569">(Email Service)</text>

  <!-- ================= DATA STORES (CYLINDERS) ================= -->
  <!-- Cylinder 1: Document Storage -->
  <g transform="translate(210, 390)">
    <!-- Body -->
    <path d="M 0 14 V 46 A 48 10 0 0 0 96 46 V 14 Z" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
    <!-- Bottom ellipse cap -->
    <ellipse cx="48" cy="46" rx="48" ry="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
    <!-- Top ellipse cap -->
    <ellipse cx="48" cy="14" rx="48" ry="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
    <text x="48" y="32" text-anchor="middle" font-size="10.5" font-weight="700" fill="#14532d">Document</text>
    <text x="48" y="44" text-anchor="middle" font-size="9" font-weight="600" fill="#15803d">Storage (Files)</text>
  </g>

  <!-- Cylinder 2: Vector Database (ChromaDB) -->
  <g transform="translate(370, 390)">
    <path d="M 0 14 V 46 A 48 10 0 0 0 96 46 V 14 Z" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
    <ellipse cx="48" cy="46" rx="48" ry="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
    <ellipse cx="48" cy="14" rx="48" ry="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
    <text x="48" y="32" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e3a8a">Vector Database</text>
    <text x="48" y="44" text-anchor="middle" font-size="9" font-weight="600" fill="#1d4ed8">(ChromaDB)</text>
  </g>

  <!-- Cylinder 3: Knowledge Graph -->
  <g transform="translate(530, 390)">
    <path d="M 0 14 V 46 A 48 10 0 0 0 96 46 V 14 Z" fill="#faf5ff" stroke="#9333ea" stroke-width="1.3"/>
    <ellipse cx="48" cy="46" rx="48" ry="10" fill="#faf5ff" stroke="#9333ea" stroke-width="1.3"/>
    <ellipse cx="48" cy="14" rx="48" ry="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.3"/>
    <text x="48" y="33" text-anchor="middle" font-size="10.5" font-weight="700" fill="#581c87">Knowledge</text>
    <text x="48" y="45" text-anchor="middle" font-size="10.5" font-weight="700" fill="#581c87">Graph</text>
  </g>

  <!-- Cylinder 4: User Database (SQLite) -->
  <g transform="translate(690, 390)">
    <path d="M 0 14 V 46 A 48 10 0 0 0 96 46 V 14 Z" fill="#f8fafc" stroke="#475569" stroke-width="1.3"/>
    <ellipse cx="48" cy="46" rx="48" ry="10" fill="#f8fafc" stroke="#475569" stroke-width="1.3"/>
    <ellipse cx="48" cy="14" rx="48" ry="10" fill="#e2e8f0" stroke="#475569" stroke-width="1.3"/>
    <text x="48" y="32" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f172a">User Database</text>
    <text x="48" y="44" text-anchor="middle" font-size="9" font-weight="600" fill="#334155">(SQLite)</text>
  </g>

  <!-- Process to Storage Connections -->
  <!-- 1.0 to Document Storage -->
  <path d="M 230 248 V 345 H 258 V 386" fill="none" stroke="#334155" stroke-width="1.4" marker-end="url(#arr-1)"/>
  
  <!-- 2.0 to Vector DB & KG -->
  <path d="M 376 248 V 345 H 418 V 386" fill="none" stroke="#334155" stroke-width="1.4" marker-end="url(#arr-1)"/>
  <path d="M 376 345 H 578 V 386" fill="none" stroke="#334155" stroke-width="1.4" marker-end="url(#arr-1)"/>

  <!-- 3.0 from Vector DB & KG (Retrieval) -->
  <path d="M 425 390 V 320 H 522 V 252" fill="none" stroke="#334155" stroke-width="1.3" marker-end="url(#arr-1)"/>
  <path d="M 570 390 V 320" fill="none" stroke="#334155" stroke-width="1.3"/>

  <!-- 4.0 & 5.0 to SQLite -->
  <path d="M 668 248 V 345 H 738 V 386" fill="none" stroke="#334155" stroke-width="1.3" marker-end="url(#arr-1)"/>
  <path d="M 814 248 V 345" fill="none" stroke="#334155" stroke-width="1.3"/>
</svg>