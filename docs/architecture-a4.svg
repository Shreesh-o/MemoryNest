<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1130" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrow marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8 Z" fill="#9333ea"/>
    </marker>

    <!-- Filters for subtle elevation shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
    <filter id="shadow-focal" x="-8%" y="-8%" width="116%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#2563eb" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- ==================== HEADER ==================== -->
  <g id="header">
    <text x="400" y="46" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a" letter-spacing="-0.02em">MemoryNest — System Architecture</text>
  </g>

  <!-- ==================== TIER 1: CLIENT LAYER ==================== -->
  <g id="tier-1">
    <rect x="40" y="80" width="720" height="118" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="56" y="74" width="128" height="14" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="120" y="84" text-anchor="middle" font-size="8" font-weight="700" fill="#475569" font-family="'JetBrains Mono', monospace" letter-spacing="0.08em">01 // CLIENT INTERFACE</text>

    <!-- Node: USER -->
    <rect x="330" y="94" width="140" height="34" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" filter="url(#shadow)"/>
    <text x="400" y="115" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a" letter-spacing="0.04em">USER</text>

    <!-- Arrow User -> Web App -->
    <path d="M 400 128 L 400 148" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Node: MemoryNest Web App -->
    <rect x="235" y="148" width="330" height="40" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" filter="url(#shadow-focal)"/>
    <text x="400" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">
      <tspan fill="#2563eb">MemoryNest</tspan> Web App (Streamlit / Next.js)
    </text>
  </g>

  <!-- Connectors Tier 1 -> Tier 2 -->
  <path d="M 330 188 V 204 Q 330 212 322 212 H 230 Q 222 212 222 220 V 224" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 470 188 V 204 Q 470 212 478 212 H 570 Q 578 212 578 220 V 224" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- ==================== TIER 2: INGESTION LAYER ==================== -->
  <g id="tier-2">
    <rect x="40" y="212" width="720" height="124" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="56" y="206" width="168" height="14" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="140" y="216" text-anchor="middle" font-size="8" font-weight="700" fill="#475569" font-family="'JetBrains Mono', monospace" letter-spacing="0.08em">02 // MULTI-MODAL INGESTION</text>

    <!-- Left Column: PDF / DOCX -->
    <rect x="135" y="226" width="174" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow)"/>
    <text x="222" y="247" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">PDF / DOCX Files</text>

    <path d="M 222 260 L 222 278" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>

    <rect x="135" y="280" width="174" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow)"/>
    <text x="222" y="301" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">Text Extraction</text>

    <!-- Right Column: Images / Scans -->
    <rect x="491" y="226" width="174" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow)"/>
    <text x="578" y="247" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">Images / Scans</text>

    <path d="M 578 260 L 578 278" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>

    <rect x="491" y="280" width="174" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow)"/>
    <text x="578" y="301" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">OCR (Tesseract)</text>
  </g>

  <!-- Connectors Tier 2 -> Preprocessing (Orthogonal merge) -->
  <path d="M 222 314 V 330 Q 222 338 230 338 H 392 Q 400 338 400 346 V 352" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 578 314 V 330 Q 578 338 570 338 H 408 Q 400 338 400 346" fill="none" stroke="#475569" stroke-width="1.4"/>

  <!-- ==================== TIER 3: PIPELINE & HYBRID RAG ==================== -->
  <g id="tier-3">
    <rect x="40" y="344" width="720" height="372" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="56" y="338" width="220" height="14" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="166" y="348" text-anchor="middle" font-size="8" font-weight="700" fill="#475569" font-family="'JetBrains Mono', monospace" letter-spacing="0.08em">03 // PROCESSING &amp; RETRIEVAL CORE</text>

    <!-- Node: Text Preprocessing -->
    <rect x="270" y="354" width="260" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow)"/>
    <text x="400" y="375" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">Text Preprocessing</text>

    <!-- Arrow -> Chunking -->
    <path d="M 400 388 L 400 404" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>

    <!-- Node: Text Chunking -->
    <rect x="270" y="406" width="260" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow)"/>
    <text x="400" y="427" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">Text Chunking</text>

    <!-- Arrow -> Embedding -->
    <path d="M 400 440 L 400 456" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>

    <!-- Node: Embedding Generation -->
    <rect x="250" y="458" width="300" height="36" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.3" filter="url(#shadow)"/>
    <text x="400" y="480" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">Embedding Generation</text>

    <!-- Split Arrow to Vector DB & Knowledge Graph -->
    <path d="M 400 494 V 506 Q 400 514 392 514 H 268 Q 260 514 260 522 V 526" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
    <path d="M 400 494 V 506 Q 400 514 408 514 H 532 Q 540 514 540 522 V 526" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>

    <!-- Node: Vector Database -->
    <rect x="160" y="528" width="200" height="42" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4" filter="url(#shadow)"/>
    <text x="260" y="546" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">Vector Database</text>
    <text x="260" y="561" text-anchor="middle" font-size="9.5" font-weight="500" fill="#166534">ChromaDB • Vector Embeddings</text>

    <!-- Node: Knowledge Graph -->
    <rect x="440" y="528" width="200" height="42" rx="6" fill="#faf5ff" stroke="#9333ea" stroke-width="1.4" filter="url(#shadow)"/>
    <text x="540" y="546" text-anchor="middle" font-size="12" font-weight="700" fill="#7e22ce">Knowledge Graph</text>
    <text x="540" y="561" text-anchor="middle" font-size="9.5" font-weight="500" fill="#6b21a8">Entity Links &amp; Relationships</text>

    <!-- Merge Arrow to RAG Retrieval -->
    <path d="M 260 570 V 582 Q 260 590 268 590 H 392 Q 400 590 400 598 V 604" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
    <path d="M 540 570 V 582 Q 540 590 532 590 H 408 Q 400 590 400 598" fill="none" stroke="#475569" stroke-width="1.4"/>

    <!-- Node: RAG Retrieval -->
    <rect x="260" y="606" width="280" height="38" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.4" filter="url(#shadow)"/>
    <text x="400" y="625" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">RAG Retrieval</text>
    <text x="400" y="638" text-anchor="middle" font-size="9" font-weight="500" fill="#475569">Hybrid Dense Retrieval + Graph Fusion</text>

    <!-- Arrow -> Ollama LLM -->
    <path d="M 400 644 L 400 662" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

    <!-- Focal Node: Ollama LLM -->
    <rect x="240" y="664" width="320" height="44" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" filter="url(#shadow-focal)"/>
    <text x="400" y="687" text-anchor="middle" font-size="13.5" font-weight="800" fill="#1e3a8a" letter-spacing="0.02em">Ollama LLM</text>
    <text x="400" y="701" text-anchor="middle" font-size="9.5" font-weight="600" fill="#2563eb">Local Model Inference (Llama 3 / Mistral)</text>
  </g>

  <!-- Connectors from Ollama LLM to 3 Output Branches -->
  <path d="M 400 708 V 724" fill="none" stroke="#475569" stroke-width="1.5"/>
  <path d="M 160 732 H 640" fill="none" stroke="#475569" stroke-width="1.5"/>
  <path d="M 400 724 V 732" fill="none" stroke="#475569" stroke-width="1.5"/>

  <!-- Left drop to Q&A -->
  <path d="M 160 732 V 744" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Center drop to Summary -->
  <path d="M 400 732 V 744" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Right drop to Event Detection -->
  <path d="M 640 732 V 744" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ==================== TIER 4: APPLICATION FEATURES ==================== -->
  <g id="tier-4">
    <rect x="40" y="736" width="720" height="344" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="56" y="730" width="205" height="14" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="158" y="740" text-anchor="middle" font-size="8" font-weight="700" fill="#475569" font-family="'JetBrains Mono', monospace" letter-spacing="0.08em">04 // APPLICATION SERVICES &amp; OUTPUTS</text>

    <!-- COLUMN 1: Q&A / CHAT -->
    <rect x="75" y="746" width="170" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow)"/>
    <text x="160" y="768" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">Q&amp;A / Chat</text>

    <path d="M 160 782 L 160 802" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>

    <rect x="75" y="804" width="170" height="42" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.3" filter="url(#shadow)"/>
    <text x="160" y="823" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0369a1">AI Response</text>
    <text x="160" y="837" text-anchor="middle" font-size="9" font-weight="500" fill="#64748b">Interactive Chatbot</text>

    <!-- COLUMN 2: SUMMARY & AUDIO -->
    <rect x="315" y="746" width="170" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow)"/>
    <text x="400" y="768" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">Text Summary</text>

    <path d="M 400 782 L 400 802" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>

    <rect x="315" y="804" width="170" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow)"/>
    <text x="400" y="826" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">Text-to-Speech</text>

    <path d="M 400 840 L 400 860" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>

    <rect x="315" y="862" width="170" height="42" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.3" filter="url(#shadow)"/>
    <text x="400" y="881" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b45309">Audio Summary</text>
    <text x="400" y="895" text-anchor="middle" font-size="9" font-weight="500" fill="#64748b">MP3 Playback &amp; Export</text>

    <!-- COLUMN 3: EVENT DETECTION & CALENDAR -->
    <rect x="540" y="746" width="200" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow)"/>
    <text x="640" y="768" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">Date / Event Detection</text>

    <path d="M 640 782 L 640 802" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>

    <rect x="540" y="804" width="200" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow)"/>
    <text x="640" y="826" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">User Confirmation</text>

    <path d="M 640 840 L 640 860" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>

    <rect x="540" y="862" width="200" height="36" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.3" filter="url(#shadow)"/>
    <text x="640" y="884" text-anchor="middle" font-size="11.5" font-weight="700" fill="#15803d">Calendar Integration</text>

    <!-- Calendar Sub-branches -->
    <path d="M 640 898 V 918 Q 640 926 632 926 H 576 Q 568 926 568 934 V 940" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
    <path d="M 640 898 V 918 Q 640 926 648 926 H 704 Q 712 926 712 934 V 940" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>

    <!-- Bottom Action Nodes -->
    <rect x="502" y="942" width="132" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow)"/>
    <text x="568" y="961" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">Email Reminder</text>
    <text x="568" y="973" text-anchor="middle" font-size="8.5" font-weight="500" fill="#64748b">SMTP Dispatch</text>

    <rect x="646" y="942" width="132" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow)"/>
    <text x="712" y="961" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">Calendar Notification</text>
    <text x="712" y="973" text-anchor="middle" font-size="8.5" font-weight="500" fill="#64748b">.ics / Google Cal</text>
  </g>


</svg>